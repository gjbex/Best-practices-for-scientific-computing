site_name: Best practices in scientific software development
site_url: https://gjbex.github.io/Best-practices-for-scientific-computing/
repo_url: https://github.com/gjbex/Best-practices-for-scientific-computing
site_author: Geert Jan Bex

nav:
  - Home: 'index.md'
  - Training overview: 'training_overview.md'
  - Introduction and motivation: 'introduction_and_motivation.md'
  - Running example:
    - Overview: 'running_example.md'
    - Optional self-study exercise: 'running_example/exercise/README.md'
    - Reference implementation: 'running_example/reference_implementation/README.md'
  - Topics:
    - Syntax vs. semantics: 'syntax_vs_semantics.md'
    - Agentic AI and scientific software: 'agentic_ai.md'
    - Code style: 'code_style.md'
    - Static analysis: 'static_analysis.md'
    - Version control:
      - Motivation: 'version_control.md'
      - Demonstration: 'version_control_demo.md'
    - Documentation: 'documentation.md'
    - Testing:
      - Overview: 'testing/index.md'
      - Testing as experiments: 'testing/testing_as_experiments.md'
      - Testing scientific software: 'testing/scientific_testing.md'
      - Numerical-integration exercise: 'testing/numerical_integration/README.md'
      - Unit testing: 'testing/unit_testing.md'
      - Functional testing: 'testing/functional_testing.md'
      - Code coverage: 'testing/code_coverage.md'
    - Optimization: 'optimization.md'
    - Deployment: 'deployment.md'
    - Continuous integration: 'continuous_integration.md'
    - Scientific I/O and data formats: 'scientific_io.md'
    - Reproducibility: 'reproducibility.md'
    - References: 'references.md'
  - Conclusions: 'conclusions.md'
  - Tools:
    - Overview: 'tools/index.md'
    - Choosing tools: 'tools/choosing_tools.md'
    - Agentic software-development tools: 'tools/agentic_ai.md'
    - General tools: 'tools/general.md'
    - C: 'tools/C.md'
    - C++: 'tools/C-plus-plus.md'
    - Fortran: 'tools/Fortran.md'
    - Rust: 'tools/Rust.md'
    - Julia: 'tools/Julia.md'
    - Python: 'tools/Python.md'
    - R: 'tools/R.md'
  - Further training: 'training.md'
  - About: 'about.md'
  - License: 'license.md'

theme:
  name: mkdocs
  highlightjs: true
  hijs_languages:
    - c
    - c++
    - fortran
    - rust
    - julia
    - python
    - r
    - bash

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
